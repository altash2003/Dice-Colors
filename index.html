<!DOCTYPE html>
<html>
<head>
    <title>Color Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #FFD700;
            --cyan: #00E5FF;
            --glass-bg: rgba(15, 20, 25, 0.6); 
            --panel-glass: rgba(0, 0, 0, 0.4); 
            --border: rgba(255, 255, 255, 0.15);
        }

        body { 
            font-family: 'Rajdhani', sans-serif; text-align: center; margin: 0; color: white; 
            background: url('background.jpg') no-repeat center center fixed; background-size: cover; 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        
        #toastBox { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; pointer-events: none; width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(0,0,0,0.95); border: 2px solid var(--gold); padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); opacity: 0; transform: translateY(-30px); animation: slideIn 0.3s forwards; display: flex; align-items: center; justify-content: center; gap: 15px; text-transform: uppercase; color: var(--gold); pointer-events: auto; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* AUTH UI */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('background.jpg') no-repeat center center fixed; background-size: cover; z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 350px; text-align: center; }
        .auth-input { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 15px; width: 100%; margin-bottom: 15px; text-align: center; border-radius: 8px; font-size: 18px; outline: none; box-sizing: border-box; }
        .auth-btn { background: var(--gold); border: none; padding: 15px; width: 100%; font-weight: 800; font-size: 20px; cursor: pointer; border-radius: 8px; color: #000; text-transform: uppercase; transition: 0.2s; }

        /* MAIN LAYOUT */
        .main-container { display: grid; grid-template-columns: 260px 1fr 260px; gap: 20px; width: 95%; height: 90vh; max-width: 1600px; }
        .side-panel { background: var(--panel-glass); backdrop-filter: blur(5px); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .game-wrapper { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        /* HUD */
        .hud-header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); height: 60px; }
        .balance-amount { font-size: 24px; color: var(--gold); font-weight: 800; }

        /* PREMIUM CHIPS STYLING */
        .betting-panel { padding: 20px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); }
        .chip-rack { display: flex; gap: 15px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 50px; justify-content: center; align-items: center; margin-bottom: 15px; }
        
        .chip { width: 60px; height: 60px; border-radius: 50%; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
        .chip:hover { transform: translateY(-5px); }
        .chip.active { transform: translateY(-8px) scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px var(--gold); }

        .chip-color-fill { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--stripe) 0%, var(--base) 50%, var(--rim) 100%); border: 3px solid var(--rim); box-sizing: border-box; }
        .chip-inner-rim { position: absolute; width: 88%; height: 88%; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.2); pointer-events: none; }
        .chip-center { width: 60%; height: 60%; background: #fdf5e6; border-radius: 50%; border: 2px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; color: #333; font-weight: 900; font-size: 14px; z-index: 2; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .chip::after { content: ''; position: absolute; top: 5%; left: 15%; width: 70%; height: 40%; background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); border-radius: 50%; pointer-events: none; }

        .chip-ivory { --base: #f5f5f0; --rim: #d1d1ca; --stripe: #a8a8a1; }
        .chip-maroon { --base: #800000; --rim: #5a0000; --stripe: #a52a2a; }
        .chip-green { --base: #228b22; --rim: #006400; --stripe: #32cd32; }
        .chip-navy { --base: #000080; --rim: #00005a; --stripe: #4169e1; }
        .chip-black { --base: #1a1a1a; --rim: #000000; --stripe: #404040; }

        /* GAME ELEMENTS */
        .bet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .bet-card { height: 100px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; border: 2px solid rgba(255,255,255,0.1); }
        .bg-RED { background: linear-gradient(135deg, #d32f2f, #b71c1c); }
        .bg-GREEN { background: linear-gradient(135deg, #388e3c, #1b5e20); }
        .bg-BLUE { background: linear-gradient(135deg, #1976d2, #0d47a1); }
        .bg-PINK { background: linear-gradient(135deg, #f06292, #c2185b); }
        .bg-WHITE { background: linear-gradient(135deg, #f5f5f5, #bdbdbd); color: #000; }
        .bg-YELLOW { background: linear-gradient(135deg, #fbc02d, #f57f17); color: #000; }
        
        .die { width: 90px; height: 90px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; border: 3px solid rgba(255,255,255,0.2); }
        #timer { font-size: 90px; font-weight: 800; text-shadow: 0 0 30px rgba(0,255,255,0.3); }

        #winModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 5000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        #winModal.show { opacity: 1; pointer-events: auto; }
        .win-card { background: #111; border: 2px solid var(--gold); padding: 30px; border-radius: 16px; text-align: center; }
    </style>
</head>
<body>
    <div id="winModal"><div class="win-card"><div style="font-size:40px; color:var(--gold); font-weight:800;">VICTORY</div><div id="winTotalDisplay" style="font-size:30px;">+0</div><div id="winListDisplay"></div></div></div>
    <div id="toastBox"></div>
    <audio id="bgMusic"></audio>

    <div id="authOverlay">
        <div id="loginForm" class="auth-box">
            <h1 style="color:var(--gold);">LOGIN</h1>
            <input type="text" id="loginUser" class="auth-input" placeholder="USERNAME">
            <input type="password" id="loginPass" class="auth-input" placeholder="PASSWORD">
            <button onclick="doLogin()" class="auth-btn">ENTER</button>
        </div>
    </div>

    <div class="main-container" id="gameUI" style="display:none;">
        <div class="side-panel"><div style="padding:15px; color:var(--gold); font-weight:800; border-bottom:1px solid var(--border);">PLAYERS</div><div id="activeListBody"></div></div>

        <div class="game-wrapper">
            <div class="hud-header">
                <div id="displayUser" style="font-weight:700;">GUEST</div>
                <div class="balance-amount"><span id="balance">0</span> TC</div>
            </div>

            <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <div id="status" style="letter-spacing:3px; color:#aaa; font-weight:700;">BETS OPEN</div>
                <div id="timer">20</div>
                <div style="display:flex; gap:20px;"><div id="die1" class="die">?</div><div id="die2" class="die">?</div><div id="die3" class="die">?</div></div>
            </div>

            <div class="betting-panel">
                <div class="chip-rack">
                    <div class="chip chip-ivory active" onclick="selectChip(50, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">50</div></div>
                    <div class="chip chip-maroon" onclick="selectChip(100, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">100</div></div>
                    <div class="chip chip-green" onclick="selectChip(500, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">500</div></div>
                    <div class="chip chip-navy" onclick="selectChip(1000, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">1K</div></div>
                    <div class="chip chip-black" onclick="selectChip(10000, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">10K</div></div>
                </div>

                <div class="bet-grid">
                    <div class="bet-card bg-RED" onclick="placeBet('RED')" id="card-RED"><b>RED</b> <div id="bet-RED">0</div></div>
                    <div class="bet-card bg-GREEN" onclick="placeBet('GREEN')" id="card-GREEN"><b>GREEN</b> <div id="bet-GREEN">0</div></div>
                    <div class="bet-card bg-BLUE" onclick="placeBet('BLUE')" id="card-BLUE"><b>BLUE</b> <div id="bet-BLUE">0</div></div>
                    <div class="bet-card bg-PINK" onclick="placeBet('PINK')" id="card-PINK"><b>PINK</b> <div id="bet-PINK">0</div></div>
                    <div class="bet-card bg-WHITE" onclick="placeBet('WHITE')" id="card-WHITE"><b>WHITE</b> <div id="bet-WHITE">0</div></div>
                    <div class="bet-card bg-YELLOW" onclick="placeBet('YELLOW')" id="card-YELLOW"><b>YELLOW</b> <div id="bet-YELLOW">0</div></div>
                </div>
            </div>
        </div>

        <div class="side-panel"><div style="padding:15px; color:var(--gold); font-weight:800; border-bottom:1px solid var(--border);">CHAT</div><div id="chatList" style="flex-grow:1; overflow-y:auto; padding:10px;"></div></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedChipValue = 50; 
        let currentBalance = 0;
        let currentBets = {};

        function selectChip(val, el) { 
            selectedChipValue = val; 
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function doLogin() { 
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            socket.emit('login', {username: u, password: p});
        }

        socket.on('login_success', data => {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('gameUI').style.display = 'grid';
            document.getElementById('displayUser').innerText = data.username;
            currentBalance = data.balance;
            document.getElementById('balance').innerText = currentBalance;
        });

        function placeBet(color) {
            if (currentBalance < selectedChipValue) return;
            currentBalance -= selectedChipValue;
            document.getElementById('balance').innerText = currentBalance;
            currentBets[color] = (currentBets[color] || 0) + selectedChipValue;
            document.getElementById(`bet-${color}`).innerText = currentBets[color];
            socket.emit('place_bet', { color: color, amount: selectedChipValue });
        }

        socket.on('timer_update', t => { 
            document.getElementById('timer').innerText = t; 
            if(t == 20) {
                document.querySelectorAll('[id^="bet-"]').forEach(el => el.innerText = '0');
                currentBets = {};
                document.getElementById('winModal').classList.remove('show');
            }
        });

        socket.on('game_result', res => {
            document.getElementById('die1').className = `die bg-${res[0]}`;
            document.getElementById('die2').className = `die bg-${res[1]}`;
            document.getElementById('die3').className = `die bg-${res[2]}`;
        });

        socket.on('win_notification', data => {
            document.getElementById('winTotalDisplay').innerText = "+" + data.total;
            document.getElementById('winModal').classList.add('show');
        });

        socket.on('update_balance', bal => { currentBalance = bal; document.getElementById('balance').innerText = bal; });
    </script>
</body>
</html>
