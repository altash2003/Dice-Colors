<!DOCTYPE html>
<html>
<head>
    <title>Premium Color Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --border: rgba(255, 255, 255, 0.15); }
        body { font-family: 'Rajdhani', sans-serif; background: url('background.jpg') no-repeat center center fixed; background-size: cover; color: white; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .game-wrapper { background: rgba(15, 20, 25, 0.6); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 1000px; padding: 20px; display: flex; flex-direction: column; }
        .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        
        /* PREMIUM CHIPS */
        .chip-rack { display: flex; gap: 15px; justify-content: center; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 50px; margin-bottom: 20px; }
        .chip { width: 60px; height: 60px; border-radius: 50%; position: relative; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
        .chip.active { transform: translateY(-8px) scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px var(--gold); }
        .chip-color-fill { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--stripe) 0%, var(--base) 50%, var(--rim) 100%); border: 3px solid var(--rim); box-sizing: border-box; }
        .chip-inner-rim { position: absolute; width: 88%; height: 88%; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.2); pointer-events: none; }
        .chip-center { width: 60%; height: 60%; background: #fdf5e6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #333; font-weight: 900; z-index: 2; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        
        .chip-ivory { --base: #f5f5f0; --rim: #d1d1ca; --stripe: #a8a8a1; }
        .chip-maroon { --base: #800000; --rim: #5a0000; --stripe: #a52a2a; }
        .chip-green { --base: #228b22; --rim: #006400; --stripe: #32cd32; }
        .chip-navy { --base: #000080; --rim: #00005a; --stripe: #4169e1; }
        .chip-black { --base: #1a1a1a; --rim: #000000; --stripe: #404040; }

        .bet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .bet-card { height: 80px; border-radius: 8px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 800; }
        .bg-RED { background: #b71c1c; } .bg-GREEN { background: #1b5e20; } .bg-BLUE { background: #0d47a1; } .bg-PINK { background: #c2185b; } .bg-WHITE { background: #f5f5f5; color: #000; } .bg-YELLOW { background: #f57f17; color: #000; }

        #timer { font-size: 80px; font-weight: 800; color: var(--gold); }
        .die { width: 70px; height: 70px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-size: 20px; }
        
        #authOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #222; padding: 30px; border-radius: 12px; border: 1px solid var(--gold); }
    </style>
</head>
<body>
    <div id="authOverlay"><div class="auth-box"><h1>COLOR GAME LOGIN</h1><input type="text" id="user" placeholder="USERNAME" style="padding:10px; width:100%; margin-bottom:10px;"><br><input type="password" id="pass" placeholder="PASSWORD" style="padding:10px; width:100%; margin-bottom:10px;"><br><button onclick="login()" style="width:100%; padding:10px; background:var(--gold); border:none; font-weight:800; cursor:pointer;">ENTER GAME</button></div></div>

    <div class="game-wrapper" id="gameUI" style="display:none;">
        <div class="hud"><div>PLAYER: <span id="displayUser"></span></div><div style="color:var(--gold); font-weight:800;">BALANCE: <span id="balance">0</span> TC</div></div>
        
        <div style="text-align:center; margin-bottom:20px;">
            <div id="timer">20</div>
            <div style="display:flex; gap:10px; justify-content:center;"><div id="die1" class="die">?</div><div id="die2" class="die">?</div><div id="die3" class="die">?</div></div>
        </div>

        <div class="chip-rack">
            <div class="chip chip-ivory active" onclick="sel(50, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">50</div></div>
            <div class="chip chip-maroon" onclick="sel(100, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">100</div></div>
            <div class="chip chip-green" onclick="sel(500, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">500</div></div>
            <div class="chip chip-navy" onclick="sel(1000, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">1K</div></div>
            <div class="chip chip-black" onclick="sel(10000, this)"><div class="chip-color-fill"></div><div class="chip-inner-rim"></div><div class="chip-center">10K</div></div>
        </div>

        <div class="bet-grid">
            <div class="bet-card bg-RED" onclick="bet('RED')">RED<div id="b-RED">0</div></div>
            <div class="bet-card bg-GREEN" onclick="bet('GREEN')">GREEN<div id="b-GREEN">0</div></div>
            <div class="bet-card bg-BLUE" onclick="bet('BLUE')">BLUE<div id="b-BLUE">0</div></div>
            <div class="bet-card bg-PINK" onclick="bet('PINK')">PINK<div id="b-PINK">0</div></div>
            <div class="bet-card bg-WHITE" onclick="bet('WHITE')">WHITE<div id="b-WHITE">0</div></div>
            <div class="bet-card bg-YELLOW" onclick="bet('YELLOW')">YELLOW<div id="b-YELLOW">0</div></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedVal = 50; 
        let bal = 0;
        let bets = {};

        function sel(v, e) { selectedVal = v; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); e.classList.add('active'); }
        function login() { socket.emit('login', {username: document.getElementById('user').value, password: document.getElementById('pass').value}); }
        
        socket.on('login_success', d => { document.getElementById('authOverlay').style.display='none'; document.getElementById('gameUI').style.display='flex'; document.getElementById('displayUser').innerText = d.username; bal = d.balance; document.getElementById('balance').innerText = bal; });
        
        function bet(c) { 
            if(bal < selectedVal) return;
            bal -= selectedVal;
            document.getElementById('balance').innerText = bal;
            bets[c] = (bets[c] || 0) + selectedVal;
            document.getElementById(`b-${c}`).innerText = bets[c];
            socket.emit('place_bet', {color: c, amount: selectedVal});
        }

        socket.on('timer_update', t => { 
            document.getElementById('timer').innerText = t; 
            if(t == 20) { document.querySelectorAll('[id^="b-"]').forEach(e => e.innerText = '0'); bets = {}; }
        });

        socket.on('game_result', r => {
            ['die1','die2','die3'].forEach((id, i) => { document.getElementById(id).className = `die bg-${r[i]}`; document.getElementById(id).innerText = ''; });
        });

        socket.on('update_balance', b => { bal = b; document.getElementById('balance').innerText = bal; });
    </script>
</body>
</html>
